<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}דשבורד צוות{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">דשבורד צוות</div>
    {% if g.user %}
    <div class="user-area">
      <span class="user-label">מחובר/ת כ:</span>
      <span class="user-name">{{ g.user.display_name }}</span>
      <span class="user-handle">(@{{ g.user.username }})</span>
      <a class="logout-btn" href="{{ url_for('dashboard.logout') }}">יציאה</a>
    </div>
    {% endif %}
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
