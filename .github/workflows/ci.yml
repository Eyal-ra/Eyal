name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # GUI deps (pyautogui/pywinauto) are not needed for the unit tests.
        run: pip install pytest PyYAML requests rich "pdfminer.six"
      - name: Run tests
        run: python -m pytest tests/ -q
