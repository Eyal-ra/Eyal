<!-- ============================================================
     "מי עדיין מחובר" - paste at the BOTTOM of the main dashboard.
     Requires GET /api/connected-employees (server-endpoint.js).
     Self-contained: scoped styles, no framework, no external assets.
     ============================================================ -->
<section id="connected-employees" dir="rtl" aria-live="polite">
  <header class="ce-head">
    <h2 class="ce-title">
      מי עדיין מחובר
      <span class="ce-count" id="ce-count" hidden></span>
    </h2>
    <div class="ce-meta">
      <span id="ce-updated"></span>
      <button type="button" id="ce-refresh" class="ce-refresh">רענן</button>
    </div>
  </header>

  <div id="ce-body" class="ce-body">
    <p class="ce-state">טוען…</p>
  </div>
</section>

<style>
  #connected-employees {
    --ce-bg: #ffffff;
    --ce-border: #e3e6ea;
    --ce-text: #1b2733;
    --ce-muted: #6b7683;
    --ce-on: #0f7b4f;
    --ce-on-bg: #e8f5ee;
    --ce-warn: #9a3412;
    margin: 24px 0 0;
    padding: 18px 20px 20px;
    background: var(--ce-bg);
    border: 1px solid var(--ce-border);
    border-radius: 12px;
    color: var(--ce-text);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #connected-employees .ce-head {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--ce-border);
    padding-bottom: 12px; margin-bottom: 14px;
  }
  #connected-employees .ce-title {
    margin: 0; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  #connected-employees .ce-count {
    background: var(--ce-on-bg); color: var(--ce-on);
    border-radius: 999px; padding: 2px 10px;
    font-size: 13px; font-weight: 700;
  }
  #connected-employees .ce-meta {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--ce-muted);
  }
  #connected-employees .ce-refresh {
    font: inherit; color: var(--ce-muted); cursor: pointer;
    background: none; border: 1px solid var(--ce-border);
    border-radius: 6px; padding: 3px 10px;
  }
  #connected-employees .ce-refresh:hover { color: var(--ce-text); border-color: var(--ce-muted); }
  #connected-employees .ce-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #connected-employees .ce-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; background: var(--ce-on-bg);
  }
  #connected-employees .ce-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ce-on); flex: none;
  }
  #connected-employees .ce-name { font-weight: 600; }
  #connected-employees .ce-since { margin-inline-start: auto; font-size: 13px; color: var(--ce-muted); }
  #connected-employees .ce-state { margin: 0; color: var(--ce-muted); font-size: 14px; }
  #connected-employees .ce-away {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px dashed var(--ce-border);
    font-size: 13px; color: var(--ce-muted); line-height: 1.7;
  }
  #connected-employees .ce-error { color: var(--ce-warn); }
</style>

<script>
(function () {
  var ENDPOINT = '/api/connected-employees';
  var REFRESH_MS = 60000;

  var body = document.getElementById('ce-body');
  var countEl = document.getElementById('ce-count');
  var updatedEl = document.getElementById('ce-updated');
  var refreshBtn = document.getElementById('ce-refresh');

  // Build with textContent only - employee names are never injected as HTML.
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function humanDuration(minutes) {
    var h = Math.floor(minutes / 60), m = minutes % 60;
    if (h && m) return h + ' שע׳ ' + m + ' דק׳';
    if (h) return h + ' שע׳';
    return m + ' דק׳';
  }

  function render(data) {
    body.textContent = '';

    if (data.error) {
      countEl.hidden = true;
      body.appendChild(el('p', 'ce-state ce-error', 'לא ניתן לקרוא נתונים מטיים ווטץ׳ כרגע.'));
      return;
    }

    var connected = data.connected || [];
    countEl.hidden = false;
    countEl.textContent = connected.length;

    if (connected.length === 0) {
      body.appendChild(el('p', 'ce-state', 'אף אחד לא מחובר כרגע.'));
    } else {
      var list = el('ul', 'ce-list');
      connected.forEach(function (emp) {
        var row = el('li', 'ce-row');
        row.appendChild(el('span', 'ce-dot'));
        row.appendChild(el('span', 'ce-name', emp.name));
        row.appendChild(el('span', 'ce-since',
          'מ־' + emp.since + ' · ' + humanDuration(emp.minutes)));
        list.appendChild(row);
      });
      body.appendChild(list);
    }

    var away = data.away || [];
    if (away.length) {
      body.appendChild(el('div', 'ce-away',
        'לא מחוברים: ' + away.map(function (e) { return e.name; }).join(', ')));
    }
    if (data.errors && data.errors.length) {
      body.appendChild(el('div', 'ce-away ce-error',
        'לא נקראו: ' + data.errors.map(function (e) { return e.name; }).join(', ')));
    }

    updatedEl.textContent = 'עודכן ' + new Date(data.fetchedAt).toLocaleTimeString('he-IL', {
      hour: '2-digit', minute: '2-digit'
    });
  }

  function load() {
    refreshBtn.disabled = true;
    fetch(ENDPOINT, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { render({ error: true }); })
      .finally(function () { refreshBtn.disabled = false; });
  }

  refreshBtn.addEventListener('click', load);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
