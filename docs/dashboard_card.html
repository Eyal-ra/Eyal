<!--
  כרטיס "סקירת דוחות כספיים" ללוח הבקרה (פורט 9999).

  להדבקה בתוך קטגוריה קיימת בלוח - למשל "מסמכים ואוטומציה" או
  "חשבונאות ובנקים". עדכנו את מונה המערכות של אותה קטגוריה ב-1.

  אם שם המחשב שמריץ את המערכת אינו "eyal", החליפו אותו בשתי הכתובות למטה.
  הכרטיס משתמש במחלקות של הלוח (system-card / card-btn וכו'); אם השמות
  אצלכם שונים - החליפו אותם, המבנה נשאר.
-->

<div class="system-card" data-system="reports-closure">
  <div class="card-status">
    <span class="status-dot"></span>
    <span class="status-text">פעיל</span>
  </div>
  <div class="card-icon">📑</div>

  <h3 class="card-title">סקירת דוחות כספיים</h3>
  <p class="card-desc">
    טיוטה → הערות סקירה → תשובה לכל הערה → סגירה סופית.
    הערה נסגרת רק עם תשובה כתובה, ודוח נסגר רק כשכל ההערות נענו.
  </p>

  <div class="card-actions">
    <a class="card-btn card-btn-primary" href="http://eyal:9998/reports/">
      ▶ פתח מערכת
    </a>
    <a class="card-btn" href="http://eyal:9998/reports/guidelines">
      הנחיות סקירה
    </a>
  </div>
</div>
