jotform:
  api_key: "YOUR_JOTFORM_API_KEY"
  form_id: "YOUR_FORM_ID"
  base_url: "https://api.jotform.com"
  field_map:
    full_name: "q3_fullName"
    phone: "q4_phone"
    id_number: "q5_idNumber"

powerlink:
  api_url: "https://api.powerlink.co.il/v1"
  api_token: "YOUR_POWERLINK_TOKEN"
  account_field: "fullName"
  phone_field: "telephone"
  id_field: "idNumber"
  customer_number_field: "customerNumber"

ravgonit:
  executable_path: 'C:\Program Files\Ravgonit\Ravgonit.exe'
  window_title_regex: "רבגונית.*"
  customer_search_field: "customer_id_input"
  full_name_field: "full_name_input"
  save_button: "save_button"
  startup_wait_seconds: 5

state:
  path: "state/seen_submissions.json"

matching:
  require_phone_or_id: true
  fuzzy_name_threshold: 0.85

# Invoice router — learns where each invoice should be forwarded (which
# client's bookkeeping "intake" mailbox) from your own Sent Items history.
invoice_router:
  graph:
    # Easiest: paste a delegated Graph access token with Mail.Read scope.
    access_token: "YOUR_GRAPH_ACCESS_TOKEN"
    # OR app-only auth (then `mailbox` is required):
    # tenant_id: "YOUR_TENANT_ID"
    # client_id: "YOUR_CLIENT_ID"
    # client_secret: "YOUR_CLIENT_SECRET"
    # mailbox: "eyal@cpateam.co.il"

  # Hand-verified rules that override anything learned from history.
  seed:
    'חברת אייל רייטר': "516879236@expense.co.il"        # your company (Sumit)
    'זקי דיאב חברת עו"ד': "517143814@expense.co.il"     # client — Sumit
    'ספרול מדיה בע"מ': "maven6405816@invoice-maven.com" # client — Maven
    # sole proprietor (Paperless): bk_b6a2l9awyl@mail.paperless.tax
