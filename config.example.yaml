jotform:
  api_key: "YOUR_JOTFORM_API_KEY"
  form_id: "YOUR_FORM_ID"
  base_url: "https://api.jotform.com"
  field_map:
    full_name: "q3_fullName"
    phone: "q4_phone"
    id_number: "q5_idNumber"

powerlink:
  api_url: "https://api.powerlink.co.il/v1"
  api_token: "YOUR_POWERLINK_TOKEN"
  account_field: "fullName"
  phone_field: "telephone"
  id_field: "idNumber"
  customer_number_field: "customerNumber"

ravgonit:
  executable_path: 'C:\Program Files\Ravgonit\Ravgonit.exe'
  window_title_regex: "רבגונית.*"
  customer_search_field: "customer_id_input"
  full_name_field: "full_name_input"
  save_button: "save_button"
  startup_wait_seconds: 5

state:
  path: "state/seen_submissions.json"

matching:
  require_phone_or_id: true
  fuzzy_name_threshold: 0.85

dashboard:
  host: "0.0.0.0"          # 0.0.0.0 = נגיש מכל המחשבים ברשת; 127.0.0.1 = מקומי בלבד
  port: 9999               # הדשבורד עולה על http://localhost:9999
  hostname: "cpateam-dash" # הכתובת הידידותית. הריצו scripts/setup_hostname.py כדי להפעיל
  # מפתח קבוע לחתימת ה-sessions. צרו מחרוזת אקראית, למשל:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
  users:
    # ליצירת password_hash:  python -m src.dashboard.hash_password
    - username: "eyal"
      display_name: "אייל רייטר"
      password_hash: "PASTE_HASH_HERE"
    # אפשר גם סיסמה בטקסט גלוי (פחות מומלץ) במקום password_hash:
    # - username: "office"
    #   display_name: "משרד"
    #   password: "1234"

reports_closure:
  # מערכת סקירת וסגירת הדוחות הכספיים - כאן נשמרים הדוחות, ההערות וההנחיות.
  # קבצי הטיוטות נשמרים ב-state/drafts/. כדאי לגבות את שניהם.
  path: "state/reports_closure.json"
  max_upload_mb: 32        # גודל מרבי לטיוטה שנטענת
  host: "0.0.0.0"          # נגיש מכל המחשבים ברשת
  port: 9998               # המערכת עולה על פורט משלה, לצד לוח הבקרה ב-9999
